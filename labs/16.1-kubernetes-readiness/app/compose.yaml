name: shikumi

services:
  api:
    build: .
    image: shikumi-api:compose
    ports:
      - "127.0.0.1:8000:5000"
    environment:
      REDIS_HOST: redis
      GREETING: ${GREETING:-hello from compose}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
